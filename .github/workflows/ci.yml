name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    # 固定到 24.04，避免 ubuntu-latest 迁移导致构建环境变化
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 20 是 package.json 声明的最低主版本，22 是当前 LTS
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Guard against committed credentials
        run: |
          if git ls-files | grep -E '^configs/accounts/.*\.json$'; then
            echo "::error::configs/accounts/*.json 不得提交（含 AK/SK）"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-24.04
    needs: check
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t arkcli-panel:ci .

      - name: Validate compose file
        run: docker compose config

      - name: Smoke test
        run: |
          sudo chown -R 999:990 configs
          HOST_PORT=18080 docker compose up -d --build --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:18080/health
          docker compose exec -T nginx sh -c "wget -q -O - --header='Content-Type: application/json' --post-data='{\"lang\":\"zh\"}' http://127.0.0.1/api/settings/language"

      - name: Logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --tail=200 --no-color

      - name: Cleanup
        if: always()
        run: docker compose down -v
